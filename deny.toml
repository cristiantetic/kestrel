# cargo-deny configuration. `cargo deny check` runs in the dev container now, and in
# CI from Story 1.2.
# No GPL code may be linked: only the licences below are allowed.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# The allow-list is written for the whole project, not today's dependency graph.
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# rust-sel4 is not on crates.io; it is a git dependency (tag v6.0.0).
allow-git = ["https://github.com/seL4/rust-sel4"]
# rust-sel4 arrives in Story 1.3.
unused-allowed-source = "allow"

# Advisories and bans use cargo-deny's defaults.
[advisories]

[bans]
